<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    The mark for Android's monochrome layer, which keeps only the alpha channel
    and tints it a single system colour. The colour mark is built from outlined
    shapes, and an outline is the one thing a single flat colour cannot express:
    filled in, the coin, the segments, the legs and the face all fuse into one
    lump. So here the ink becomes a gap. Every shape is filled solid out to the
    outer edge of its stroke, then the ink is cut back out as holes in a mask.

    Three kinds of cut:

    - A full ring at the coin's edge, and a second at its inner ring. Outside
      the overlap these fall on transparent ground and cost nothing.
    - A left-facing arc on each node and on the head, where it meets the segment
      behind it. These are partial on purpose: a full ring would also cut the
      legs passing underneath and leave them floating.
    - The legs themselves, clipped to the body, so the part of each leg that
      crosses its segment reads as a groove and the part below it stays solid —
      which is exactly what the outlined colour mark does. Only the three middle
      legs are cut. The rearmost leg and the two front legs sit behind the body
      in the colour mark, so there is no groove for them to leave.

    The coin's glint is dropped and every stroke is thicker, because this layer
    is composited at launcher size where both would close up.
  -->
  <defs>
    <clipPath id="body">
      <path d="M108 726 C132 626 196 566 292 570 C388 574 452 640 456 712 C460 784 392 836 296 832 C200 828 132 800 108 726 Z"/>
      <circle cx="455" cy="712" r="58"/>
      <circle cx="572" cy="700" r="72"/>
      <ellipse cx="750" cy="650" rx="150" ry="134" transform="rotate(-6 750 650)"/>
    </clipPath>
  </defs>

  <mask id="mark" maskUnits="userSpaceOnUse" x="0" y="0" width="1024" height="1024">
    <g transform="translate(-16 -54)">
      <g fill="#FFFFFF" stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round">
        <g fill="none" stroke-width="46">
          <path d="M718 518 L706 418 L812 348"/>
          <path d="M792 540 L840 476 L944 486"/>
        </g>
        <g fill="none" stroke-width="38">
          <path d="M372 744 L306 602 L220 846 L150 846"/>
          <path d="M352 772 L332 892 L262 892"/>
          <path d="M452 668 L446 884 L376 884"/>
          <path d="M570 640 L584 872 L514 872"/>
          <path d="M690 730 L748 880 L818 880"/>
          <path d="M796 742 L870 850 L940 850"/>
        </g>
        <g transform="translate(14 34) translate(470 430) scale(0.84) translate(-470 -430)">
          <circle cx="470" cy="430" r="220" stroke="none"/>
        </g>
        <path d="M108 726 C132 626 196 566 292 570 C388 574 452 640 456 712 C460 784 392 836 296 832 C200 828 132 800 108 726 Z" stroke-width="26"/>
        <circle cx="455" cy="712" r="58" stroke-width="26"/>
        <circle cx="572" cy="700" r="72" stroke-width="26"/>
        <ellipse cx="750" cy="650" rx="150" ry="134" transform="rotate(-6 750 650)" stroke-width="26"/>
      </g>

      <g fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round">
        <g transform="translate(14 34) translate(470 430) scale(0.84) translate(-470 -430)">
          <circle cx="470" cy="430" r="220" stroke-width="26"/>
          <circle cx="470" cy="430" r="150" stroke-width="24"/>
        </g>
        <path d="M455 641 A 71 71 0 0 0 455 783" stroke-width="26"/>
        <path d="M572 615 A 85 85 0 0 0 572 785" stroke-width="26"/>
        <path d="M625 556 A 163 147 0 0 0 625 744" stroke-width="26"/>
        <g clip-path="url(#body)" stroke-width="38">
          <path d="M352 772 L332 892 L262 892"/>
          <path d="M452 668 L446 884 L376 884"/>
          <path d="M570 640 L584 872 L514 872"/>
        </g>
        <path d="M760 594 Q786 556 812 594" stroke-width="26"/>
        <path d="M742 674 Q808 740 868 670" stroke-width="30"/>
      </g>
    </g>
  </mask>
  <rect width="1024" height="1024" fill="#000000" mask="url(#mark)"/>
</svg>
